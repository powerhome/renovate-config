name: Check publication catalog

on:
  pull_request:
    paths:
      - bin/collect_publication_dates.py
      - publication/catalog.json
      - publication-age-containers.json
      - publication-age-actions.json
      - bin/generate_publication_preset.py
      - publication/check_collector.py
      - publication/check_containers.mjs
      - publication/check_actions.mjs
      - .github/workflows/check-publication-catalog.yml
      - .github/workflows/collect-publication-dates.yml
  push:
    branches: [main]
    paths:
      - bin/collect_publication_dates.py
      - publication/catalog.json
      - publication-age-containers.json
      - publication-age-actions.json
      - bin/generate_publication_preset.py
      - publication/check_collector.py
      - publication/check_containers.mjs
      - publication/check_actions.mjs
      - .github/workflows/check-publication-catalog.yml
      - .github/workflows/collect-publication-dates.yml

permissions:
  contents: read

jobs:
  collector-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run collector protocol fixtures
        run: python3 -m unittest publication/check_collector.py

  renovate-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: renovate/renovate:44.198.0@sha256:15ee7727b68a54cae567171dcf14f279023c110da5825d85fdfb2b4c5751c5aa
      options: --user 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check generated publication allowlist
        run: python3 bin/generate_publication_preset.py --check
      - name: Validate Renovate presets
        run: renovate-config-validator publication-age-containers.json publication-age-actions.json
      - name: Exercise container publication behavior
        env:
          RENOVATE_ROOT: /usr/local/renovate
        run: node publication/check_containers.mjs
      - name: Exercise GitHub Actions publication behavior
        env:
          RENOVATE_ROOT: /usr/local/renovate
        run: node publication/check_actions.mjs
