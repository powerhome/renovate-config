name: Collect container publication dates

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
    paths:
      - bin/collect_publication_dates.py
      - publication/catalog.json
      - publication-age-containers.json
      - bin/generate_publication_preset.py
      - .github/workflows/collect-publication-dates.yml

permissions:
  contents: read
  packages: read

concurrency:
  group: container-publication-dates
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check generated publication allowlist
        run: python3 bin/generate_publication_preset.py --check
      - name: Collect complete registry snapshots
        env:
          GH_TOKEN: ${{ secrets.PUBLICATION_READ_TOKEN || github.token }}
        run: python3 bin/collect_publication_dates.py --output "$RUNNER_TEMP/publication-feed"
      - name: Publish snapshot branch
        env:
          PUBLISH_TOKEN: ${{ github.token }}
        run: |
          # Configure the short-lived token in this step's process environment.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUBLISH_TOKEN" | base64 -w0)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin publication-data > /dev/null; then
            git fetch --depth=1 origin publication-data
            git switch --create publication-data FETCH_HEAD
          else
            git switch --orphan publication-data
          fi
          git rm -r --ignore-unmatch --quiet data
          cp -R "$RUNNER_TEMP/publication-feed/data" .
          git add data
          if ! git diff --cached --quiet; then
            git commit --signoff -m 'Refresh container publication dates' -m 'Record complete registry snapshots for the publication-age datasource.'
            git push origin HEAD:publication-data
          fi
